locale = "en-US"
hasCJKLanguage = true
# Local preview; CI overrides this with the GitHub Pages base URL.
baseURL = "http://localhost:1314/"
title = "Hugo Alice"
theme = "Alice"
themesDir = "../.."

# Alice parameters
[params]
    title = "Hugo Alice"
    author = "Xuekun Li"
    description = ""
    mainSections = ["docs", "gallery"]

    keywords = []
    dateFmt = "2006-01-02"
    license = "DBADPL"

    [params.header]
        blogo = "img/HugoAliceLogo.webp"
        title = "Hugo Alice"
        tagline = "so damn classic"
        [params.header.dropdown]
            mode = "hover"
        # Side TOC
        [params.header.sidetoc]
            icon = "svg/ui-oval/align-left-02.svg"
        # Hamburger menu
        [params.header.hamburger]
            icon = "svg/ui-oval/menu-01.svg"

    [params.dropdown]
        mode = "hover"

    # Button shortcode defaults ({{< button >}}). Any shortcode argument wins.
    [params.button]
        # plain|primary|secondary|download|link
        type = "plain"
        # sm|md|lg
        size = "md"
        # Full width of the content column.
        block = false
        # Extra classes added to every button.
        class = ""

    # Radio shortcode defaults ({{< radio >}}). Any shortcode argument wins.
    [params.radio]
        # small|s, medium|m, or large|l
        size = "medium"
        # Selected-ring fill color (any CSS color). Empty uses the theme's
        # CornflowerBlue.
        tintColor = ""
        # Inner dot (mark) color (any CSS color). Empty uses White.
        dotColor = ""
        # Unselected ring border color (any CSS color). Empty uses SlateGray.
        borderColor = ""
        # Extra classes added to every radio.
        class = ""

    # ButtonGroup shortcode defaults ({{< buttongroup >}}). Any shortcode
    # argument wins; children can override the group size, while group
    # disabled=true disables every child.
    [params.buttongroup]
        # vertical|v or horizontal|h
        orientation = "vertical"
        # Extra classes added to every group.
        class = ""

    # Checkbox shortcode defaults ({{< checkbox >}}). Any shortcode argument
    # wins.
    [params.checkbox]
        # small|s, medium|m, or large|l
        size = "medium"
        # Checked-box fill color (any CSS color). Empty uses the theme's
        # CornflowerBlue.
        tintColor = ""
        # Check mark color (any CSS color). Empty uses White.
        checkColor = ""
        # Unchecked box border color (any CSS color). Empty uses SlateGray.
        borderColor = ""
        # Extra classes added to every checkbox.
        class = ""

    # Switch shortcode defaults ({{< switch >}}). Any shortcode argument wins.
    [params.switch]
        # Initial state: on (true) or off (false).
        on = false
        # Track color while on (any CSS color). Empty uses the theme's
        # CornflowerBlue.
        tintColor = ""
        # Thumb color (any CSS color). Empty uses White.
        thumbColor = ""
        # small|s, medium|m, or large|l
        size = "medium"
        # Extra classes added to every switch.
        class = ""

    # Slider shortcode defaults ({{< slider >}}). Any shortcode argument wins.
    [params.slider]
        # Initial value. Clamped to [min, max] and snapped to the nearest step.
        value = 50
        # Range endpoints.
        min = 0
        max = 100
        # Increment; must be greater than 0.
        step = 1
        # Suffix appended to the value readout, e.g. "%" or " px".
        unit = ""
        # Width of the whole control (any CSS length or percentage).
        # Empty uses 100% for a block slider and auto for an inline one.
        width = ""
        # Show the current value beside the label.
        showValue = true
        # small|s, medium|m, or large|l
        size = "medium"
        # Minimum-track, remaining-track, and thumb colors (any CSS color).
        # Empty uses the theme's CornflowerBlue, Gainsboro, and White.
        tintColor = ""
        trackColor = ""
        thumbColor = ""
        # Extra classes added to every slider.
        class = ""

    # TextLine shortcode defaults ({{< textline >}}). Any shortcode argument
    # wins.
    [params.textline]
        # Initial text.
        value = ""
        # Hint shown while the field is empty.
        placeholder = ""
        # small|s, medium|m, or large|l
        size = "medium"
        # Icon placement: start (left) or end (right).
        iconPos = "start"
        # Width of the whole control (any CSS length or percentage).
        # Empty uses 100% for a block field and 12em for an inline one.
        width = ""
        # Extra classes added to every text line.
        class = ""

    # TextField shortcode defaults ({{< textfield >}}). Any shortcode argument
    # wins.
    [params.textfield]
        # Hint shown while the field is empty.
        placeholder = ""
        # Initial height in text rows.
        rows = 4
        # small|s, medium|m, or large|l
        size = "medium"
        # Icon placement: start (left) or end (right).
        iconPos = "start"
        # Native resize handle: none|vertical|horizontal|both
        resize = "vertical"
        # Width of the whole control (any CSS length or percentage).
        # Empty uses 100%.
        width = ""
        # Extra classes added to every text field.
        class = ""

    # Breadcrumb bar under the header. Shown on every page by default; set
    # enable = false here, or `breadcrumb: false` in a page's front matter.
    # The Home crumb (text and icon) and section icons reuse menu.main entries.
    # A page may override via front matter: breadcrumb: { enable, label, separator, title }.
    [params.breadcrumb]
        enable = true
        # Accessible name for the breadcrumb nav landmark.
        label = "Breadcrumb"
        # Separator between crumbs: an icon path, or literal text / HTML.
        # Set it to "" to render no separator.
        separator = "svg/ui-oval/slash-divider.svg"

    # Documentation pages (type: docs) render a left page tree and, when the
    # page sets toc.show, the snaketoc on the right.
    [params.docs]
        # Show the page tree on the left by default. A page can override this
        # with `docs: { nav: false }` in front matter.
        nav = true
        # Title above the page tree and in the mobile <details>. Empty uses
        # the docs section's own title.
        title = ""

    # Carousel shortcode defaults ({{< carousel >}} + {{< slide >}}).
    # Every key is a fallback; a shortcode argument still wins.
    [params.carousel]
        # Number of slides visible at once (effect = "slide" only).
        # Screens up to 40em always show one slide.
        perView = 1
        # Let slivers of the adjacent slides show on both edges.
        scrollHint = false
        # Circular navigation: last -> first, and first -> last.
        loop = true
        # Arrow keys move between slides while the carousel is focused.
        keyboard = true
        # Transition: "slide" or "fade".
        effect = "slide"
        # Image content mode: "scaleToFill" (default), "aspectFit", or "aspectFill".
        contentMode = "scaleToFill"
        # Fixed carousel frame ratio, e.g. "3/2" or "16/9"; "auto" uses the
        # ratio of the image shown first, so switching never changes the height.
        aspectRatio = "auto"
        # Caption overlay position: bottom-left, bottom-center, bottom-right,
        # top-left, top-center, or top-right.
        captionPosition = "bottom-center"
        # Accessible name for the carousel region.
        label = "Carousel"

        [params.carousel.autoplay]
            # Enable autoplay. A ring button shows progress and toggles it.
            enabled = false
            # Autoplay delay in milliseconds (used when enabled is true).
            interval = 5000
            # Progress: "both" (bar + ring), "bar", "ring", or "none".
            progressStyle = "both"
            # Position of the progress bar when it is shown: top or bottom.
            progressPosition = "top"
            # Pause autoplay while the pointer or keyboard focus is inside.
            pause = false

        [params.carousel.navigator]
            # Show previous/next buttons.
            enabled = true
            # Float prev/next over the image. When false they sit below it.
            overlay = true
            # Placement. Overlaid: bottom-left, bottom-center, bottom-right,
            # top-left, top-center, top-right, or left-right.
            # Below: left, center, right, or left-right.
            position = "left-right"

        [params.carousel.indicator]
            # Style: dots, segments, counter, or thumbnails.
            # "thumbnails" uses preview images in the control position.
            style = "dots"
            # Float the indicator over the image. When false it sits below it.
            overlay = false
            # Placement. Overlay: bottom-left, bottom-center, bottom-right,
            # top-left, top-center, or top-right.
            # Below: left, center, right.
            position = "center"

        [params.carousel.icons]
            prev = "svg/ui-oval/chevron-left.svg"
            next = "svg/ui-oval/chevron-right.svg"
            play = "svg/ui-oval/play.svg"
            pause = "svg/ui-oval/pause.svg"

    # Link render hook
    [params.link.icons]
        external = "svg/ui-oval/link-external-02.svg"

    # Admonition shortcode defaults ({admonition, note, tip, info, help, alert}).
    # All of these are fallbacks — any per-shortcode argument still wins.
    [params.admonition]
        # Default `type` when the admonition shortcode omits it: note|info|tip|help|alert
        defaultType = "info"
        # Whether the box is collapsible
        collapsible = false
        # When collapsible = true, whether it starts open
        open = false
        # Collapse-arrow placement: "begin" | "middle" | "end"
        markerPosition = "end"
        # Collapse-arrow direction: "clockwise" | "counterclockwise"
        markerRotation = "counterclockwise"

        [params.admonition.note]
            title = "NOTE"
            icon = "svg/ui-oval/edit-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.info]
            title = "INFO"
            icon = "svg/ui-oval/info-square.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.tip]
            title = "TIP"
            icon = "svg/ui-oval/lightbulb-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.help]
            title = "QUESTION"
            icon = "svg/ui-oval/help-circle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.alert]
            title = "WARN"
            icon = "svg/ui-oval/alert-triangle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

    # Details shortcode defaults
    [params.details.icons]
        # Summary icon used when icon= is not passed.
        icon = "svg/ui-oval/info-square.svg"
        # Collapse marker used when marker= is not passed. Admonitions use
        # params.admonition.<type>.marker instead.
        marker = "svg/ui-oval/play.svg"

    # Sidenote shortcode defaults
    [params.sidenote]
        # pin icon (sprite path)
        icon = "svg/ui-oval/pin-02.svg"

    # Attachment shortcode defaults.
    [params.attachment]
        # Show the attachment icon.
        showIcon = true
        # Show the file size next to the attachment name.
        showSize = true
        # Icon for each attachment type. `default` is used for an unset,
        # "file", or unknown type.
        [params.attachment.iconmap]
            default = "svg/ui-oval/file-05.svg"
            code = "svg/ui-oval/file-code-01.svg"
            image = "svg/ui-oval/image-01.svg"
            tarball = "svg/ui-oval/cube-01.svg"

    # Post metadata icons
    [params.post.meta.icons]
        date = "svg/ui-oval/calendar.svg"
        lastmod = "svg/ui-oval/calendar-plus-02.svg"
        location = "svg/ui-oval/marker-pin-04.svg"
        category = "svg/ui-oval/folder.svg"
        tag = "svg/ui-oval/tag-01.svg"

    # Previous/next post links
    [params.post.prext.icons]
        prev = "svg/ui-oval/align-left-01.svg"
        next = "svg/ui-oval/align-right-01.svg"

    # Jump to top/bottom buttons
    [params.post.jump.icons]
        up = "svg/ui-oval/chevron-up.svg"
        down = "svg/ui-oval/chevron-down.svg"

    # Icon shortcode defaults ({{< icon >}}). Any shortcode argument wins.
    [params.icon]
        # Icon set directory under static/svg for a bare `name`.
        set = "ui-oval"
        # Default size (any CSS length; a bare number means px). Empty uses
        # 1em from static/css/icon.css.
        size = ""
        # Default color (any CSS color). Empty inherits the surrounding text color.
        color = ""
        # Extra classes added to every icon.
        class = ""

    # Universal fallback path; the icon component's defaults live in params.icon above.
    [params.icons]
        placeholder = "svg/placeholder.svg"

    # Label shortcode defaults ({{< label >}}). Any shortcode argument wins.
    [params.label]
        # 2xs|xs|sm|md|lg, or a CSS font-size length.
        size = "sm"
        # Text and surface colors (any CSS color). Empty uses the theme defaults.
        color = ""
        backgroundColor = ""
        # Full CSS border shorthand. Empty uses 1px solid Silver (the
        # borderWidth/borderStyle/borderColor chain).
        border = ""
        borderWidth = ""
        borderStyle = ""
        borderColor = ""
        borderRadius = ""
        # CSS box-shadow. Empty uses none.
        shadow = ""
        # CSS padding shorthand. Empty follows the size preset.
        padding = ""
        # CSS font-weight. Empty uses 500.
        fontWeight = ""
        # Gap between the icon and text. Empty follows the size preset.
        gap = ""
        # Icon size and color. Empty uses 1em and the label text color.
        iconSize = ""
        iconColor = ""
        # Extra classes added to every label.
        class = ""

    # Card shortcode defaults ({{< card >}}). Any shortcode argument wins.
    [params.card]
        # row|column. Empty follows the card's own default ("row").
        layout = "row"
        # Cover width (any CSS length). Empty uses the stylesheet's 8em.
        coverWidth = ""
        # CSS aspect-ratio for the cover, e.g. "2/3". Empty keeps the natural ratio.
        coverRatio = ""
        # Cover position in the row layout: left|right.
        coverPos = "left"
        # Link target. Empty opens external http(s) links in a new tab.
        target = ""
        # Link rel. Empty uses noopener noreferrer when target is _blank.
        rel = ""
        # Cover loading attribute: lazy or eager.
        loading = "lazy"
        # Extra classes added to every card.
        class = ""

    [params.footer]
        # Should display site generator (Hugo) and theme (Alice) 🥰
        showHugoAlice = true
        # Copy{left,right} statement, HTML is allowed
        copymid = ""
        # License statement, HTML is allowed
        license = 'Licensed under the <a href="https://dbad-license.org/"><b>DBADPL</b></a>'
        # Creation year of your site
        since = 2024
        # Creator name, HTML is allowed
        creator = "<b>MistY</b>"

    [params.home]
        [params.home.pagination]
            # Only pages in the given sections are paginated on the home page.
            sections = ["docs"]
            # The number of pages per page.
            pagerSize = 3
            # Previous indicator, HTML is allowed
            prev = "&laquo;"
            # Next indicator, HTML is allowed
            next = "&raquo;"
            # First indicator, HTML is allowed
            first = "&laquo;&laquo;"
            # Last indicator, HTML is allowed
            last = "&raquo;&raquo;"

        [params.home.sidebar]
            [[params.home.sidebar.items]]
                id = "news"
                title = "News"
                weight = 1
                enable = true
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and news, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Will be your side item template name and html element id
                id = "recent-updates"
                title = "Recent Updates"
                weight = 2
                enable = true
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and post title, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Pinned posts from every section, newest first
                id = "pinned"
                title = "Pinned"
                weight = 3
                enable = true
                [params.home.sidebar.items.args]
                    size = 5

            [[params.home.sidebar.items]]
                id = "tag-list"
                title = "Tags"
                weight = 4
                enable = true
                [params.home.sidebar.items.args]
                    size = 10
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

            [[params.home.sidebar.items]]
                id = "category-list"
                title = "Categories"
                weight = 5
                enable = true
                [params.home.sidebar.items.args]
                    size = 5
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

    [params.postcard]
        showDescription = true

    [params.codeblock]
        maxLinesOfCode = 64

        [params.codeblock.icons]
            copy = "svg/ui-oval/copy-01.svg"
            check = "svg/ui-oval/check.svg"
            close = "svg/ui-oval/x-close.svg"

    [params.tex]
        # mathjax | katex | hugo
        engine = 'mathjax'
        # Site-wide defaults; a page can override any of them in front matter.
        math = false
        algorithm = false
        # Run `npm run build:tikz` to inline pre-rendered SVG. Without that
        # cache — and in `hugo server` — TikZ falls back to the TikZJax CDN.
        tikz = false
        # Delimiters for inline and block math, set as a begin/end pair.
        # Leave a pair empty to use the defaults: \(...\) inline and \[...\] block.
        # These need the Goldmark passthrough extension enabled below, since
        # Goldmark would otherwise strip the leading backslash. Set '$' / '$$'
        # to use the dollar pairs instead; a literal dollar in prose then needs
        # care, because Goldmark consumes \$ before a client engine sees it.
        # Only the client-side engines use these; "hugo" uses the passthrough
        # delimiters under [markup].
        inlineBeginDelimiter = ''
        inlineEndDelimiter = ''
        blockBeginDelimiter = ''
        blockEndDelimiter = ''
        [params.tex.mathjax]
            version = '3.2.2'
        [params.tex.katex]
            version = '0.19.1'
        [params.tex.hugo]
            # KaTeX embedded in this Hugo release. Not params.tex.katex.version.
            version = '0.18.4'
            # mathml (no CSS) | html | htmlAndMathml (needs that KaTeX's CSS).
            # Only "mathml", "html", and "htmlAndMathml" are accepted.
            output = 'mathml'

        [params.tex.pseudocode]
            version = '2.4.1'
            indentSize = '1.6em'
            commentDelimiter = '//'
            lineNumber = true
            lineNumberPunc = ''
            noEnd = true
            scopeLines = false
            titlePrefix = 'Algorithm'

    [params.imgproc]
        enable = false
        maxWidth = 1280
        maxHeight = 1280
        format = 'webp'
        # 0-100
        quality = 75

    [params.lightbox]
        # fancybox or glightbox
        vendor = 'fancybox'

    # waline v3 comment system
    [params.waline]
        enable = false
        # required
        serverURL = 'your-waline-server-domain.example.com'
        # optional
        # default language, https://waline.js.org/guide/features/i18n.html
        language = 'en'
        reaction = false

    # code editor
    [params.codeeditor]
        # ('codemirror5' | 'cm5') or ('codemirror6' | 'cm6')
        # codemirror5 is recommended
        # codemirror6 is still under development, it lacks a lot of common language support,
        # and you have to bundle the script yourself
        vendor = 'codemirror5'
        # https://codemirror.net/5/doc/manual.html#addons
        addons = []


# The theme mounts node_modules/katex, node_modules/mathjax, and
# node_modules/pseudocode. In this repository the dependencies are installed at
# the theme root, so point the example site at those copies as well.
[module]
    # Declaring any mount for a target replaces that target's default mount, so
    # keep the site's own assets directory (where build:tikz writes its cache).
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "../node_modules/katex/dist"
        target = "assets/node_modules/katex/dist"
    [[module.mounts]]
        source = "../node_modules/katex/package.json"
        target = "assets/node_modules/katex/package.json"
    [[module.mounts]]
        source = "../node_modules/katex-hugo/dist"
        target = "assets/node_modules/katex-hugo/dist"
    [[module.mounts]]
        source = "../node_modules/katex-hugo/package.json"
        target = "assets/node_modules/katex-hugo/package.json"
    [[module.mounts]]
        source = "../node_modules/mathjax/es5"
        target = "assets/node_modules/mathjax/es5"
    [[module.mounts]]
        source = "../node_modules/mathjax/package.json"
        target = "assets/node_modules/mathjax/package.json"
    [[module.mounts]]
        source = "../node_modules/pseudocode/build"
        target = "assets/node_modules/pseudocode/build"
    [[module.mounts]]
        source = "../node_modules/pseudocode/package.json"
        target = "assets/node_modules/pseudocode/package.json"

# Hugo parameters with Alice default initialization
[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark.renderer]
        unsafe = true
    # Math needs this: the theme's default delimiters are \(...\) / \[...\],
    # and Hugo does not merge [markup] from a theme, so every site that renders
    # math enables the extension itself. The "hugo" engine requires it too.
    # Do not add a '$' / '$' pair: the extension runs on every page, so
    # "$5 and $10" would be parsed as math. Inline math stays \(...\).
    [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
            block = [['\[', '\]'], ['$$', '$$']]
            inline = [['\(', '\)']]
    [markup.goldmark.parser]
        wrapStandAloneImageWithinParagraph = false
        [markup.goldmark.parser.attribute]
            block = true
            title = true
    [markup.highlight]
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ''
        hl_inline = false
        lineAnchors = ''
        lineNoStart = 1
        lineNos = false
        lineNumbersInTable = true
        noClasses = false
        noHl = false
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = false
    [markup.goldmark]
        [markup.goldmark.extensions.typographer]
            emDash = '&HorizontalLine;&HorizontalLine;'
            leftDoubleQuote = '"'
            rightDoubleQuote = '"'
            leftSingleQuote = "'"
            rightSingleQuote = "'"

# Declaring [taxonomies] replaces Hugo defaults; keep category/tag and add jokes.
# More and Gallery are content sections, not taxonomies.
[taxonomies]
    category = "categories"
    tag = "tags"
    joke = "jokes"



# Menu icons — params.icon is a map. Required:
#   path = the icon's key relative to rootDir ("ui-oval/home-03.svg"), used to look up the sprite id.
# Optional (applied to the rendered <svg>):
#   class = extra classes (a string or a list; appended to the default "menu-icon menu-<id>-icon").
#   id    = an id for the <svg> (overrides any default).
#   attrs = raw literal attributes appended to the <svg> (aria-hidden="true" is always present).
# To add a new icon, drop its svg into a sprite source dir (see sprite.config.js `sprites`) and rerun
# `npm run build:icons`; the id is generated automatically.
[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1
        [menu.main.params.icon]
            path = "svg/ui-oval/home-03.svg"

    [[menu.main]]
        identifier = "docs"
        name = "Docs"
        url = "/docs/"
        weight = 2
        [menu.main.params.icon]
            path = "svg/ui-oval/file-05.svg"

    [[menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
        weight = 3
        [menu.main.params.icon]
            path = "svg/ui-oval/folder.svg"

    [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 4
        [menu.main.params.icon]
            path = "svg/ui-oval/tag-01.svg"

    # More is a section hub (/more/); dropdown children can be section or taxonomy.
    [[menu.main]]
        identifier = "more"
        name = "More"
        url = "/more/"
        weight = 5
        [menu.main.params.icon]
            path = "svg/ui-oval/brackets-ellipses.svg"

    [[menu.main]]
        identifier = "gallery"
        name = "Gallery"
        url = "/gallery/"
        parent = "more"
        weight = 1
        # Optional; falls back to the target page's description.
