locale = "en-US"
hasCJKLanguage = true
title = "Hugo Alice"
theme = "Alice"
themesDir = "../.."

# Alice parameters
[params]
    title = "Hugo Alice"
    author = "Xuekun Li"
    description = ""
    mainSections = ["posts", "gallery"]

    keywords = []
    dateFmt = "2006-01-02"
    license = "DBADPL"

    [params.header]
        blogo = "img/HugoAliceLogo.webp"
        title = "Hugo Alice"
        tagline = "so damn classic"
        [params.header.dropdown]
            mode = "hover"
        # Side TOC
        [params.header.sidetoc]
            icon = "svg/ui-oval/align-left-02.svg"
        # Hamburger menu
        [params.header.hamburger]
            icon = "svg/ui-oval/menu-01.svg"

    [params.dropdown]
        mode = "hover"

    # Carousel shortcode defaults ({{< carousel >}} + {{< slide >}}).
    # Every key is a fallback; a shortcode argument still wins.
    [params.carousel]
        # Enable autoplay. The pause button appears when this is true.
        autoplay = false
        # Autoplay delay in milliseconds (used when autoplay is true).
        interval = 5000
        # Autoplay progress bar position: top or bottom.
        progressPosition = "top"
        # Show previous/next buttons.
        controls = true
        # Control bar placement: below, top, or bottom (top/bottom overlay the content).
        controlsPosition = "below"
        # Place each control and the indicator: left, center, right.
        prevAlign = "left"
        indicatorStyle = "dots"
        indicatorAlign = "center"
        nextAlign = "right"
        autoplayAlign = "right"
        # Number of slides visible at once (effect = "slide" only).
        # Screens up to 40em always show one slide.
        perView = 1
        # Text between the current and total values when indicatorStyle = "counter".
        counterSeparator = "/"
        # Circular navigation: last -> first, and first -> last.
        loop = true
        # Arrow keys move between slides while the carousel is focused.
        keyboard = true
        # Pause autoplay while the pointer or keyboard focus is inside.
        pause = false
        # Transition: "slide" or "fade".
        effect = "slide"
        # Image content mode: "scaleToFill" (default), "aspectFit", or "aspectFill".
        contentMode = "scaleToFill"
        # Vertical place of the overlay prev/next icon: top, center, or bottom.
        vAlign = "center"
        # Accessible name for the carousel region.
        label = "Carousel"

        [params.carousel.icons]
            prev = "svg/ui-oval/chevron-left.svg"
            next = "svg/ui-oval/chevron-right.svg"
            play = "svg/ui-oval/play.svg"
            pause = "svg/ui-oval/stop.svg"

    # Link render hook
    [params.link.icons]
        external = "svg/ui-oval/link-external-02.svg"

    # Admonition shortcode defaults ({admonition, note, tip, info, help, alert}).
    # All of these are fallbacks — any per-shortcode argument still wins.
    [params.admonition]
        # Default `type` when the admonition shortcode omits it: note|info|tip|help|alert
        defaultType = "info"
        # Whether the box is collapsible
        collapsible = false
        # When collapsible = true, whether it starts open
        open = false
        # Collapse-arrow placement: "begin" | "middle" | "end"
        markerPosition = "end"
        # Collapse-arrow direction: "clockwise" | "counterclockwise"
        markerRotation = "counterclockwise"

        [params.admonition.note]
            title = "NOTE"
            icon = "svg/ui-oval/edit-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.info]
            title = "INFO"
            icon = "svg/ui-oval/info-square.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.tip]
            title = "TIP"
            icon = "svg/ui-oval/lightbulb-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.help]
            title = "QUESTION"
            icon = "svg/ui-oval/help-circle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.alert]
            title = "WARN"
            icon = "svg/ui-oval/alert-triangle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

    # Details shortcode defaults
    [params.details.icons]
        # Summary icon used when icon= is not passed.
        icon = "svg/ui-oval/info-square.svg"
        # Collapse marker used when marker= is not passed. Admonitions use
        # params.admonition.<type>.marker instead.
        marker = "svg/ui-oval/play.svg"

    # Sidenote shortcode defaults
    [params.sidenote]
        # pin icon (sprite path)
        icon = "svg/ui-oval/pin-02.svg"

    # Attachment shortcode defaults.
    [params.attachment]
        # Show the attachment icon.
        showIcon = true
        # Show the file size next to the attachment name.
        showSize = true
        # Icon for each attachment type. `default` is used for an unset,
        # "file", or unknown type.
        [params.attachment.iconmap]
            default = "svg/ui-oval/file-05.svg"
            code = "svg/ui-oval/file-code-01.svg"
            image = "svg/ui-oval/image-01.svg"
            tarball = "svg/ui-oval/cube-01.svg"

    # Post metadata icons
    [params.post.meta.icons]
        date = "svg/ui-oval/calendar.svg"
        lastmod = "svg/ui-oval/calendar-plus-02.svg"
        location = "svg/ui-oval/marker-pin-04.svg"
        category = "svg/ui-oval/folder.svg"
        tag = "svg/ui-oval/tag-01.svg"

    # Previous/next post links
    [params.post.prext.icons]
        prev = "svg/ui-oval/align-left-01.svg"
        next = "svg/ui-oval/align-right-01.svg"

    # Jump to top/bottom buttons
    [params.post.jump.icons]
        up = "svg/ui-oval/chevron-up.svg"
        down = "svg/ui-oval/chevron-down.svg"

    # Only the universal fallback lives here; component icons live under their own params.
    [params.icons]
        placeholder = "svg/placeholder.svg"

    [params.footer]
        # Should display site generator (Hugo) and theme (Alice) 🥰
        showHugoAlice = true
        # Copy{left,right} statement, HTML is allowed
        copymid = ""
        # License statement, HTML is allowed
        license = 'Licensed under the <a href="https://dbad-license.org/"><b>DBADPL</b></a>'
        # Creation year of your site
        since = 2024
        # Creator name, HTML is allowed
        creator = "<b>MistY</b>"

    [params.home]
        [params.home.pagination]
            # Only posts in given sections will be paginated
            sections = ["posts"]
            # The number of posts per page
            pagerSize = 3
            # Previous indicator, HTML is allowed
            prev = "&laquo;"
            # Next indicator, HTML is allowed
            next = "&raquo;"
            # First indicator, HTML is allowed
            first = "&laquo;&laquo;"
            # Last indicator, HTML is allowed
            last = "&raquo;&raquo;"

        [params.home.sidebar]
            [[params.home.sidebar.items]]
                id = "news"
                title = "News"
                weight = 1
                enable = true
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and news, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Will be your side item template name and html element id
                id = "recent-updates"
                title = "Recent Updates"
                weight = 2
                enable = true
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and post title, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Pinned posts from every section, newest first
                id = "pinned"
                title = "Pinned"
                weight = 3
                enable = true
                [params.home.sidebar.items.args]
                    size = 5

            [[params.home.sidebar.items]]
                id = "tag-list"
                title = "Tags"
                weight = 4
                enable = true
                [params.home.sidebar.items.args]
                    size = 10
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

            [[params.home.sidebar.items]]
                id = "category-list"
                title = "Categories"
                weight = 5
                enable = true
                [params.home.sidebar.items.args]
                    size = 5
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

    [params.codeblock]
        maxLinesOfCode = 64

        [params.codeblock.icons]
            copy = "svg/ui-oval/copy-01.svg"
            check = "svg/ui-oval/check.svg"
            close = "svg/ui-oval/x-close.svg"

    [params.tex]
        # mathjax or katex
        engine = 'mathjax'
        inlineBeginDelimiter = ''
        inlineEndDelimiter = ''
        blockBeginDelimiter = ''
        blockEndDelimiter = ''

    [params.imgproc]
        enable = false
        maxWidth = 1280
        maxHeight = 1280
        format = 'webp'
        # 0-100
        quality = 75

    [params.lightbox]
        # fancybox or glightbox
        vendor = 'fancybox'

    # waline v3 comment system
    [params.waline]
        enable = false
        # required
        serverURL = 'your-waline-server-domain.example.com'
        # optional
        # default language, https://waline.js.org/guide/features/i18n.html
        language = 'en'
        reaction = false

    # code editor
    [params.codeeditor]
        # ('codemirror5' | 'cm5') or ('codemirror6' | 'cm6')
        # codemirror5 is recommended
        # codemirror6 is still under development, it lacks a lot of common language support,
        # and you have to bundle the script yourself
        vendor = 'codemirror5'
        # https://codemirror.net/5/doc/manual.html#addons
        addons = []


# Hugo parameters with Alice default initialization
[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark.renderer]
        unsafe = true
    [markup.goldmark.parser]
        wrapStandAloneImageWithinParagraph = false
        [markup.goldmark.parser.attribute]
            block = true
            title = true
    [markup.highlight]
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ''
        hl_inline = false
        lineAnchors = ''
        lineNoStart = 1
        lineNos = false
        lineNumbersInTable = true
        noClasses = false
        noHl = false
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = false
    [markup.goldmark]
        [markup.goldmark.extensions.typographer]
            emDash = '&HorizontalLine;&HorizontalLine;'
            leftDoubleQuote = '"'
            rightDoubleQuote = '"'
            leftSingleQuote = "'"
            rightSingleQuote = "'"

# Declaring [taxonomies] replaces Hugo defaults; keep category/tag and add jokes.
# More and Gallery are content sections, not taxonomies.
[taxonomies]
    category = "categories"
    tag = "tags"
    joke = "jokes"



# Menu icons — params.icon is a map. Required:
#   path = the icon's key relative to rootDir ("ui-oval/home-03.svg"), used to look up the sprite id.
# Optional (applied to the rendered <svg>):
#   class = extra classes (a string or a list; appended to the default "menu-icon menu-<id>-icon").
#   id    = an id for the <svg> (overrides any default).
#   attrs = raw literal attributes appended to the <svg> (aria-hidden="true" is always present).
# To add a new icon, drop its svg into a sprite source dir (see sprite.config.js `sprites`) and rerun
# `npm run build:icons`; the id is generated automatically.
[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1
        [menu.main.params.icon]
            path = "svg/ui-oval/home-03.svg"

    [[menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 2
        [menu.main.params.icon]
            path = "svg/ui-oval/archive.svg"

    [[menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
        weight = 3
        [menu.main.params.icon]
            path = "svg/ui-oval/folder.svg"

    [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 4
        [menu.main.params.icon]
            path = "svg/ui-oval/tag-01.svg"

    # More is a section hub (/more/); dropdown children can be section or taxonomy.
    [[menu.main]]
        identifier = "more"
        name = "More"
        url = "/more/"
        weight = 5
        [menu.main.params.icon]
            path = "svg/ui-oval/brackets-ellipses.svg"

    [[menu.main]]
        identifier = "gallery"
        name = "Gallery"
        url = "/gallery/"
        parent = "more"
        weight = 1
        # Optional; falls back to the target page's description.
        [menu.main.params]
            description = "…"
        [menu.main.params.icon]
            path = "svg/ui-oval/image-01.svg"

    [[menu.main]]
        identifier = "jokes"
        name = "Jokes"
        url = "/jokes/"
        parent = "more"
        weight = 2
        [menu.main.params.icon]
            path = "svg/ui-oval/message-smile-square.svg"

    [[menu.main]]
        identifier = "friends"
        name = "Friends"
        url = "/friends/"
        weight = 6
        [menu.main.params.icon]
            path = "svg/ui-oval/users-01.svg"

    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 7
        [menu.main.params.icon]
            path = "svg/ui-oval/user-01.svg"

    [[menu.main]]
        identifier = "rss"
        name = "RSS"
        url = "/index.xml"
        weight = 8
        [menu.main.params.icon]
            path = "svg/ui-oval/rss-01.svg"

[sitemap]
    changefreq = 'weekly'
    filename = 'sitemap.xml'
    priority = 0.5
