# Alice parameters
[params]
    mainSections = ["posts"]
    dateFmt = "2006-01-02"
    license = ""

    [params.seo]
        title = "Your site title"
        author = "Your name"
        description = "Your site description"
        keywords = ["your", "site", "keywords"]

    [params.header]
        blogo = "img/HugoAliceLogo.webp"
        title = "Hugo Alice"
        tagline = "so damn classic"
        # "baseurl" or "imgurl" or "https://somewhere.com"
        logoTarget = "baseurl"
        # Header override for nested menu dropdowns (falls back to params.dropdown.mode)
        [params.header.dropdown]
            mode = "hover"
        # TOC toggle icon
        [params.header.sidetoc]
            icon = "svg/ui-oval/align-left-02.svg"
        # Hamburger menu icon
        [params.header.hamburger]
            icon = "svg/ui-oval/menu-01.svg"

    # Shared dropdown component / shortcode defaults
    [params.dropdown]
        # "hover" (default) or "click"
        mode = "hover"

    # Carousel shortcode defaults ({{< carousel >}} + {{< slide >}}).
    # Every key is a fallback; a shortcode argument still wins.
    [params.carousel]
        # Number of slides visible at once (effect = "slide" only).
        # Screens up to 40em always show one slide.
        perView = 1
        # Let slivers of the adjacent slides show on both edges.
        scrollHint = false
        # Circular navigation: last -> first, and first -> last.
        loop = true
        # Arrow keys move between slides while the carousel is focused.
        keyboard = true
        # Transition: "slide" or "fade".
        effect = "slide"
        # Image content mode: "scaleToFill" (default), "aspectFit", or "aspectFill".
        contentMode = "scaleToFill"
        # Fixed carousel frame ratio, e.g. "3/2" or "16/9"; "auto" uses the
        # ratio of the image shown first, so switching never changes the height.
        aspectRatio = "auto"
        # Caption overlay position: bottom-left, bottom-center, bottom-right,
        # top-left, top-center, or top-right.
        captionPosition = "bottom-center"
        # Accessible name for the carousel region.
        label = "Carousel"

        [params.carousel.autoplay]
            # Enable autoplay. A ring button shows progress and toggles it.
            enabled = false
            # Autoplay delay in milliseconds (used when enabled is true).
            interval = 5000
            # Progress: "both" (bar + ring), "bar", "ring", or "none".
            progressStyle = "both"
            # Position of the progress bar when it is shown: top or bottom.
            progressPosition = "top"
            # Pause autoplay while the pointer or keyboard focus is inside.
            pause = false

        [params.carousel.navigator]
            # Show previous/next buttons.
            enabled = true
            # Float prev/next over the image. When false they sit below it.
            overlay = true
            # Placement. Overlaid: bottom-left, bottom-center, bottom-right,
            # top-left, top-center, top-right, or left-right.
            # Below: left, center, right, or left-right.
            position = "left-right"

        [params.carousel.indicator]
            # Style: dots, segments, counter, or thumbnails.
            # "thumbnails" uses preview images in the control position.
            style = "dots"
            # Float the indicator over the image. When false it sits below it.
            overlay = false
            # Placement. Overlay: bottom-left, bottom-center, bottom-right,
            # top-left, top-center, or top-right.
            # Below: left, center, right.
            position = "center"

        [params.carousel.icons]
            prev = "svg/ui-oval/chevron-left.svg"
            next = "svg/ui-oval/chevron-right.svg"
            play = "svg/ui-oval/play.svg"
            pause = "svg/ui-oval/pause.svg"

    # Link render hook
    [params.link.icons]
        external = "svg/ui-oval/link-external-02.svg"

    # Admonition shortcode defaults ({admonition, note, tip, info, help, alert}).
    # All of these are fallbacks — any per-shortcode argument still wins.
    [params.admonition]
        # Default `type` when the admonition shortcode omits it: note|info|tip|help|alert
        defaultType = "info"
        # Whether the box is collapsible
        collapsible = false
        # When collapsible = true, whether it starts open
        open = false
        # Collapse-arrow placement: "begin" | "middle" | "end"
        markerPosition = "end"
        # Collapse-arrow direction: "clockwise" | "counterclockwise"
        markerRotation = "counterclockwise"

        [params.admonition.note]
            title = "NOTE"
            icon = "svg/ui-oval/edit-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.info]
            title = "INFO"
            icon = "svg/ui-oval/info-square.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.tip]
            title = "TIP"
            icon = "svg/ui-oval/lightbulb-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.help]
            title = "QUESTION"
            icon = "svg/ui-oval/help-circle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

        [params.admonition.alert]
            title = "WARN"
            icon = "svg/ui-oval/alert-triangle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counterclockwise"

    # Details shortcode defaults
    [params.details.icons]
        # Summary icon used when icon= is not passed.
        icon = "svg/ui-oval/info-square.svg"
        # Collapse marker used when marker= is not passed. Admonitions use
        # params.admonition.<type>.marker instead.
        marker = "svg/ui-oval/play.svg"

    # Sidenote shortcode defaults
    [params.sidenote]
        # sidenote icon (sprite path)
        icon = "svg/ui-oval/pin-02.svg"

    # Attachment shortcode defaults.
    [params.attachment]
        # Show the attachment icon.
        showIcon = true
        # Show the file size next to the attachment name.
        showSize = true
        # Icon for each attachment type. `default` is used for an unset,
        # "file", or unknown type.
        [params.attachment.iconmap]
            default = "svg/ui-oval/file-05.svg"
            code = "svg/ui-oval/file-code-01.svg"
            image = "svg/ui-oval/image-01.svg"
            tarball = "svg/ui-oval/cube-01.svg"

    # Post metadata icons
    [params.post.meta.icons]
        date = "svg/ui-oval/calendar.svg"
        lastmod = "svg/ui-oval/calendar-plus-02.svg"
        location = "svg/ui-oval/marker-pin-01.svg"
        category = "svg/ui-oval/folder.svg"
        tag = "svg/ui-oval/tag-01.svg"

    # Previous/next post links
    [params.post.prext.icons]
        prev = "svg/ui-oval/align-left-01.svg"
        next = "svg/ui-oval/align-right-01.svg"

    # Jump to top/bottom buttons
    [params.post.jump.icons]
        up = "svg/ui-oval/chevron-up.svg"
        down = "svg/ui-oval/chevron-down.svg"

    # Only the universal fallback lives here; component icons live under their own params.
    [params.icons]
        placeholder = "svg/placeholder.svg"

    [params.footer]
        # Should display site generator (Hugo) and theme (Alice) 🥰
        showHugoAlice = true
        # Copy{left,right} statement, HTML is allowed
        copymid = "Your copy{left,right} statement."
        # License statement, HTML is allowed
        license = "Your site license statement."
        # Creation year of your site
        since = 1970
        # Creator name, HTML is allowed
        creator = "somebody"

    [params.home]
        [params.home.pagination]
            # Only posts in given sections will be paginated
            sections = ["posts"]
            # The number of posts per page
            pagerSize = 5
            # Previous indicator, HTML is allowed
            prev = "&laquo;"
            # Next indicator, HTML is allowed
            next = "&raquo;"
            # First indicator, HTML is allowed
            first = "&laquo;&laquo;"
            # Last indicator, HTML is allowed
            last = "&raquo;&raquo;"

        [params.home.sidebar]
            [[params.home.sidebar.items]]
                id = "news"
                title = "News"
                weight = 1
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and news, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Will be your side item template name and html element id
                id = "recent-updates"
                title = "Recent Updates"
                weight = 2
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and post title, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Pinned posts from every section, newest first
                id = "pinned"
                title = "Pinned"
                weight = 3
                enable = true
                [params.home.sidebar.items.args]
                    size = 5

            [[params.home.sidebar.items]]
                id = "tag-list"
                title = "Tags"
                weight = 4
                [params.home.sidebar.items.args]
                    size = 10
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

            [[params.home.sidebar.items]]
                id = "category-list"
                title = "Categories"
                weight = 5
                [params.home.sidebar.items.args]
                    size = 5
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

    [params.storage]
        # localStorage or sessionStorage
        type = "sessionStorage"

    [params.codeblock]
        maxLinesOfCode = 64

        [params.codeblock.icons]
            copy = "svg/ui-oval/copy-01.svg"
            check = "svg/ui-oval/check.svg"
            close = "svg/ui-oval/x-close.svg"

    [params.tex]
        # mathjax (default, client) | katex (client) | hugo (build time, hugo's transform.ToMath)
        engine = 'mathjax'
        # Site-wide defaults; a page can override any of them in front matter.
        # Pages opt in because math is expensive: turn these on to enable it
        # everywhere, or leave them off and set tex.math etc. per page.
        math = false
        algorithm = false
        tikz = false
        # Inline/block delimiter pairs. Empty uses $...$ and $$...$$;
        # \(...\) and \[...\] always work. Client engines only; "hugo"
        # reads the passthrough delimiters.
        inlineBeginDelimiter = ''
        inlineEndDelimiter = ''
        blockBeginDelimiter = ''
        blockEndDelimiter = ''
        # Checked against the installed package.json; a mismatch fails the build.
        [params.tex.mathjax]
            version = '3.2.2'
        [params.tex.katex]
            version = '0.19.1'
        # Build-time rendering. version is the KaTeX embedded in Hugo,
        # not params.tex.katex.version.
        [params.tex.hugo]
            version = '0.18.4'
            # https://gohugo.io/functions/transform/tomath/#output
            # mathml (default, no CSS) | html | htmlAndMathml (needs CSS).
            # Any other value fails the build.
            output = 'mathml'

        # pseudocode.js (tex.algorithm). Options match
        # https://github.com/SaswatPadhi/pseudocode.js#global-options;
        # omit one to use the library default.
        [params.tex.pseudocode]
            version = '2.4.1'
            # Indent in a control block; needs an "em" unit.
            indentSize = '1.6em'
            # Whole-line comment marker.
            commentDelimiter = '//'
            lineNumber = true
            lineNumberPunc = ''
            # Hide "end if", "end procedure", ...
            noEnd = true
            # Vertical lines for nested scopes.
            scopeLines = false
            titlePrefix = 'Algorithm'
            # Restart the caption counter here; omit to keep it running.

    [params.imgproc]
        enable = false
        maxWidth = 1280
        maxHeight = 1280
        format = 'webp'
        # 0-100
        quality = 75

    [params.lightbox]
        # fancybox or glightbox
        vendor = 'fancybox'

    [params.postcard]
        # "posturl" or "imgurl"
        thumbTarget = "posturl"
        showDescription = false

    # Post list on /posts/, category and tag pages. A post with `pinned: true`
    # in its front matter renders first, in its own group above the normal list.
    # Pinned posts keep the list's normal order (weight, then date).
    [params.postlist]
        [params.postlist.pinned]
            # Heading above the pinned group; set to "" to hide the heading
            title = "Pinned"
            # Pin icon (in the heading and next to each pinned post)
            icon = "svg/ui-oval/pin-01.svg"

    # waline v3 comment system
    [params.waline]
        enable = false
        # required
        serverURL = 'your-waline-server-domain.example.com'
        # optional
        # default language, https://waline.js.org/guide/features/i18n.html
        language = 'en'
        reaction = false


# Node-installed math assets (katex, mathjax). The theme declares the mounts, so
# a site only needs to install the dependencies:
#   hugo mod npm pack
#   npm install
# Defining module.mounts replaces the module defaults, so the standard theme
# directories are mounted explicitly here as well.
[module]
    [[module.mounts]]
        source = "archetypes"
        target = "archetypes"
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "content"
        target = "content"
    [[module.mounts]]
        source = "data"
        target = "data"
    [[module.mounts]]
        source = "i18n"
        target = "i18n"
    [[module.mounts]]
        source = "layouts"
        target = "layouts"
    [[module.mounts]]
        source = "static"
        target = "static"
    [[module.mounts]]
        source = "node_modules/katex/dist"
        target = "assets/node_modules/katex/dist"
    [[module.mounts]]
        source = "node_modules/katex/package.json"
        target = "assets/node_modules/katex/package.json"
    [[module.mounts]]
        source = "node_modules/katex-hugo/dist"
        target = "assets/node_modules/katex-hugo/dist"
    [[module.mounts]]
        source = "node_modules/katex-hugo/package.json"
        target = "assets/node_modules/katex-hugo/package.json"
    [[module.mounts]]
        source = "node_modules/mathjax/es5"
        target = "assets/node_modules/mathjax/es5"
    [[module.mounts]]
        source = "node_modules/mathjax/package.json"
        target = "assets/node_modules/mathjax/package.json"
    [[module.mounts]]
        source = "node_modules/pseudocode/build"
        target = "assets/node_modules/pseudocode/build"
    [[module.mounts]]
        source = "node_modules/pseudocode/package.json"
        target = "assets/node_modules/pseudocode/package.json"

# Hugo parameters with Alice default initialization
[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark.renderer]
        unsafe = true
    [markup.goldmark.parser]
        wrapStandAloneImageWithinParagraph = false
        [markup.goldmark.parser.attribute]
            block = true
            title = true
    [markup.highlight]
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ''
        hl_inline = false
        lineAnchors = ''
        lineNoStart = 1
        lineNos = false
        lineNumbersInTable = true
        noClasses = false
        noHl = false
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = false
    [markup.goldmark]
        [markup.goldmark.extensions.typographer]
            emDash = '&HorizontalLine;&HorizontalLine;'
            leftDoubleQuote = '"'
            rightDoubleQuote = '"'
            leftSingleQuote = "'"
            rightSingleQuote = "'"

# Optional extra taxonomies (e.g. jokes). More itself is a section: content/more/.
# Declaring [taxonomies] replaces Hugo defaults — redeclare every one you need.
# [taxonomies]
#     category = "categories"
#     tag = "tags"
#     joke = "jokes"



# Menu icons — params.icon is a map. Required:
#   path = the icon's key relative to rootDir ("ui-oval/home-03.svg"), used to look up the sprite id
#          in the shared sprite_map.json.
# Optional (applied to the rendered <svg>):
#   class = extra classes appended to the default "menu-icon menu-<id>-icon" (a string or a list).
#   id    = an id for the <svg> (overrides any default).
#   attrs = raw literal attributes appended to the <svg> (aria-hidden="true" is always present).
# The menu header hard-codes the default class in menu-entry.html; when params.icon.class is set it is appended.
# To add a new icon, drop its svg into a sprite source dir (see sprite.config.js `sprites`) and rerun
# `npm run build:icons`; the id is generated automatically. Omit params.icon to use the placeholder icon.
[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1
        [menu.main.params.icon]
            path = "svg/ui-oval/home-03.svg"

    [[menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 2
        [menu.main.params.icon]
            path = "svg/ui-oval/archive.svg"

    [[menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
        weight = 3
        [menu.main.params.icon]
            path = "svg/ui-oval/folder.svg"

    [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 4
        [menu.main.params.icon]
            path = "svg/ui-oval/tag-01.svg"

    # Optional More hub: content/more/_index.md + menu entry (section, not taxonomy).
    # Dropdown children use parent = "more" (section or taxonomy URLs both work).
    # [[menu.main]]
    #     identifier = "more"
    #     name = "More"
    #     url = "/more/"
    #     weight = 5
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/brackets-ellipses.svg"
    # [[menu.main]]
    #     identifier = "gallery"
    #     name = "Gallery"
    #     url = "/gallery/"
    #     parent = "more"
    #     weight = 1
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/image-01.svg"
    # [[menu.main]]
    #     identifier = "jokes"
    #     name = "Jokes"
    #     url = "/jokes/"
    #     parent = "more"
    #     weight = 2
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/message-smile-square.svg"

    # [[menu.main]]
    #     identifier = "friends"
    #     name = "Friends"
    #     url = "/friends/"
    #     weight = 6
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/users-01.svg"

    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 7
        [menu.main.params.icon]
            path = "svg/ui-oval/user-01.svg"

    [[menu.main]]
        identifier = "rss"
        name = "RSS"
        url = "/index.xml"
        weight = 8
        [menu.main.params.icon]
            path = "svg/ui-oval/rss-01.svg"

[sitemap]
    changefreq = 'weekly'
    filename = 'sitemap.xml'
    priority = 0.5
