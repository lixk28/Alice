# Alice parameters
[params]
    mainSections = ["posts"]
    dateFmt = "2006-01-02"
    license = ""

    [params.seo]
        title = "Your site title"
        author = "Your name"
        description = "Your site description"
        keywords = ["your", "site", "keywords"]

    [params.header]
        blogo = "img/HugoAliceLogo.webp"
        title = "Hugo Alice"
        tagline = "so damn classic"
        # "baseurl" or "imgurl" or "https://somewhere.com"
        logoTarget = "baseurl"
        # Header override for nested menu dropdowns (falls back to params.dropdown.mode)
        [params.header.dropdown]
            mode = "hover"

    # Shared dropdown component / shortcode defaults
    [params.dropdown]
        # "hover" (default) or "click"
        mode = "hover"

    # Admonition shortcode defaults ({admonition, note, tip, info, help, alert}).
    # All of these are fallbacks — any per-shortcode argument still wins.
    [params.admonition]
        # Default `type` when the admonition shortcode omits it: note|info|tip|help|alert
        defaultType = "info"
        # Whether the box is collapsible
        collapsible = false
        # When collapsible = true, whether it starts open
        open = false
        # Collapse-arrow placement: "begin" | "middle" | "end"
        markerPosition = "end"
        # Collapse-arrow direction: "clockwise" | "counter-clockwise"
        markerRotation = "counter-clockwise"

        [params.admonition.note]
            title = "NOTE"
            icon = "svg/ui-oval/edit-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counter-clockwise"

        [params.admonition.info]
            title = "INFO"
            icon = "svg/ui-oval/info-square.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counter-clockwise"

        [params.admonition.tip]
            title = "TIP"
            icon = "svg/ui-oval/lightbulb-05.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counter-clockwise"

        [params.admonition.help]
            title = "QUESTION"
            icon = "svg/ui-oval/help-circle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counter-clockwise"

        [params.admonition.alert]
            title = "WARN"
            icon = "svg/ui-oval/alert-triangle.svg"
            marker = "svg/ui-oval/chevron-left.svg"
            collapsible = false
            open = false
            markerPosition = "end"
            markerRotation = "counter-clockwise"

    # Sidenote shortcode defaults
    [params.sidenote]
        # sidenote icon (sprite path)
        icon = "svg/ui-oval/pin-02.svg"

    [params.footer]
        # Should display site generator (Hugo) and theme (Alice) 🥰
        showHugoAlice = true
        # Copy{left,right} statement, HTML is allowed
        copymid = "Your copy{left,right} statement."
        # License statement, HTML is allowed
        license = "Your site license statement."
        # Creation year of your site
        since = 1970
        # Creator name, HTML is allowed
        creator = "somebody"

    [params.home]
        [params.home.pagination]
            # Only posts in given sections will be paginated
            sections = ["posts"]
            # The number of posts per page
            pagerSize = 5
            # Previous indicator, HTML is allowed
            prev = "&laquo;"
            # Next indicator, HTML is allowed
            next = "&raquo;"
            # First indicator, HTML is allowed
            first = "&laquo;&laquo;"
            # Last indicator, HTML is allowed
            last = "&raquo;&raquo;"

        [params.home.sidebar]
            [[params.home.sidebar.items]]
                id = "news"
                title = "News"
                weight = 1
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and news, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                # Will be your side item template name and html element id
                id = "recent-updates"
                title = "Recent Updates"
                weight = 2
                [params.home.sidebar.items.args]
                    size = 5
                    dateFmt = "2006-01-02"
                    # Delimiter between date and post title, HTML is allowed
                    delimiter = "&ensp;"

            [[params.home.sidebar.items]]
                id = "tag-list"
                title = "Tags"
                weight = 3
                [params.home.sidebar.items.args]
                    size = 10
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

            [[params.home.sidebar.items]]
                id = "category-list"
                title = "Categories"
                weight = 4
                [params.home.sidebar.items.args]
                    size = 5
                    delimiter = "&emsp;"
                    # Sort by {count | random}, default is count
                    sortBy = "count"

    [params.storage]
        # localStorage or sessionStorage
        type = "sessionStorage"

    [params.codeblock]
        maxLinesOfCode = 64

    [params.tex]
        # mathjax or katex
        engine = 'mathjax'
        inlineBeginDelimiter = ''
        inlineEndDelimiter = ''
        blockBeginDelimiter = ''
        blockEndDelimiter = ''

    [params.imgproc]
        enable = false
        maxWidth = 1280
        maxHeight = 1280
        format = 'webp'
        # 0-100
        quality = 75

    [params.lightbox]
        # fancybox or glightbox
        vendor = 'fancybox'

    [params.postcard]
        # "posturl" or "imgurl"
        thumbTarget = "posturl"
        showDescription = false

    # waline v3 comment system
    [params.waline]
        enable = false
        # required
        serverURL = 'your-waline-server-domain.example.com'
        # optional
        # default language, https://waline.js.org/guide/features/i18n.html
        language = 'en'
        reaction = false


# Hugo parameters with Alice default initialization
[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark.renderer]
        unsafe = true
    [markup.goldmark.parser]
        wrapStandAloneImageWithinParagraph = false
        [markup.goldmark.parser.attribute]
            block = true
            title = true
    [markup.highlight]
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ''
        hl_inline = false
        lineAnchors = ''
        lineNoStart = 1
        lineNos = false
        lineNumbersInTable = true
        noClasses = false
        noHl = false
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = false
    [markup.goldmark]
        [markup.goldmark.extensions.typographer]
            emDash = '&HorizontalLine;&HorizontalLine;'
            leftDoubleQuote = '"'
            rightDoubleQuote = '"'
            leftSingleQuote = "'"
            rightSingleQuote = "'"

# Optional extra taxonomies (e.g. jokes). More itself is a section: content/more/.
# Declaring [taxonomies] replaces Hugo defaults — redeclare every one you need.
# [taxonomies]
#     category = "categories"
#     tag = "tags"
#     joke = "jokes"



# Menu icons — params.icon is a map. Required:
#   path = the icon's key relative to rootDir ("ui-oval/home-03.svg"), used to look up the sprite id
#          in the shared sprite_map.json.
# Optional (applied to the rendered <svg>):
#   class = extra classes appended to the default "menu-icon menu-<id>-icon" (a string or a list).
#   id    = an id for the <svg> (overrides any default).
#   attrs = raw literal attributes appended to the <svg> (aria-hidden="true" is always present).
# The menu header hard-codes the default class in menu-entry.html; when params.icon.class is set it is appended.
# To add a new icon, drop its svg into a sprite source dir (see sprite.config.js `sprites`) and rerun
# `npm run build:icons`; the id is generated automatically. Omit params.icon to use the placeholder icon.
[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1
        [menu.main.params.icon]
            path = "svg/ui-oval/home-03.svg"

    [[menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 2
        [menu.main.params.icon]
            path = "svg/ui-oval/archive.svg"

    [[menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
        weight = 3
        [menu.main.params.icon]
            path = "svg/ui-oval/folder.svg"

    [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 4
        [menu.main.params.icon]
            path = "svg/ui-oval/tag-01.svg"

    # Optional More hub: content/more/_index.md + menu entry (section, not taxonomy).
    # Dropdown children use parent = "more" (section or taxonomy URLs both work).
    # [[menu.main]]
    #     identifier = "more"
    #     name = "More"
    #     url = "/more/"
    #     weight = 5
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/brackets-ellipses.svg"
    # [[menu.main]]
    #     identifier = "gallery"
    #     name = "Gallery"
    #     url = "/gallery/"
    #     parent = "more"
    #     weight = 1
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/image-01.svg"
    # [[menu.main]]
    #     identifier = "jokes"
    #     name = "Jokes"
    #     url = "/jokes/"
    #     parent = "more"
    #     weight = 2
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/message-smile-square.svg"

    # [[menu.main]]
    #     identifier = "friends"
    #     name = "Friends"
    #     url = "/friends/"
    #     weight = 6
    #     [menu.main.params.icon]
    #         path = "svg/ui-oval/users-01.svg"

    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 7
        [menu.main.params.icon]
            path = "svg/ui-oval/user-01.svg"

    [[menu.main]]
        identifier = "rss"
        name = "RSS"
        url = "/index.xml"
        weight = 8
        [menu.main.params.icon]
            path = "svg/ui-oval/rss-01.svg"

[sitemap]
    changefreq = 'weekly'
    filename = 'sitemap.xml'
    priority = 0.5
