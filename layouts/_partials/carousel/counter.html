{{- /*
  Counter shared by the carousel control bar.

  Context:
    current — current position or visible range, e.g. 1 or "1–2"
    total   — total slide count
*/ -}}
<span class="carousel-counter" aria-hidden="true">
	<span class="carousel-counter-current">{{ .current }}</span>
	{{- partial "svg-icon.html" (dict
		"path" "svg/ui-oval/slash-divider.svg"
		"class" "carousel-counter-separator"
	) -}}
	<span class="carousel-counter-total">{{ .total }}</span>
</span>
