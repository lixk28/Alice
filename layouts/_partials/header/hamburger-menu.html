<label id="hamburger-btn-icon-wrapper" for="hamburger-btn">
	<svg id="hamburger-btn-icon" aria-hidden="true"><use href="{{ (site.Params.icons.sprite | default "svg/sprite/svg-icon-sprite.svg") | relURL }}#ui-oval_menu-01"/></svg>
</label>
<input type="checkbox" id="hamburger-btn" name="hamburger-btn">
<nav id="hamburger-menu">
	{{- with .Site.Menus.main -}}
	{{- range $item := . -}}
	{{- partial "header/menu-entry.html" (dict "item" $item "variant" "hamburger" "mode" "click") -}}
	{{- end -}}
	{{- end -}}
</nav>
