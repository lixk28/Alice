{{/* stolen from https://danilafe.com/blog/sidenotes, with some modifications */}}

{{- $index := .Get "index" | default .Ordinal -}}
{{- $label := .Get "label" -}}
<span class="sidenote" id="sidenote-{{ $index }}">
    <label class="sidenote-label" for="sidenote-{{ $index }}-checkbox">{{ $label | chomp | markdownify }}</label>
    <input class="sidenote-checkbox" type="checkbox" id="sidenote-{{ $index }}-checkbox"></input>
    <span class="sidenote-content" id="sidenote-{{ $index }}-content">
        {{ partial "svg-icon.html" (dict "path" "svg/ui-oval/pin-02.svg" "class" "sidenote-pin-icon") }}
        {{ trim .Inner "\n" | markdownify }}
    </span>
</span>
