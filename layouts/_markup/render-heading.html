{{- $level := .Level -}}
<h{{ $level }} id="{{ .Anchor }}">
    {{- if eq $level 1 -}}
    #
    {{- else if eq $level 2 -}}
    ##
    {{- else if eq $level 3 -}}
    ###
    {{- else if eq $level 4 -}}
    ####
    {{- end -}}
    &ensp;{{- .Text | safeHTML -}}
    &ensp;<a class="heading-pilcrow" href="#{{ .Anchor }}">¶</a>
</h{{ $level }}>
